<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جولة في لوحة تحكم أتراس لينك — عرض توضيحي</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   أتراس لينك — عرض لوحة التحكم على صفحة الهبوط (V4.2.0)
   ---------------------------------------------------------------------
   الفكرة: جولة قصصية من 5 فصول. كل فصل = قيمة تجارية واحدة،
   تُعرض كما يراها فريق الشركة (لوحة التحكم) وكما يراها العميل (جوال واتساب).
   كل الأرقام والأسماء بيانات تجريبية مترابطة حسابياً (انظر DEMO بالأسفل).
   ===================================================================== */

/* ---------- 1) الهوية والألوان (من لوحة التحكم الحالية) ---------- */
:root{
  --g9:#0B3D2E; --g8:#0F4F3B; --g7:#0F6B4E; --g6:#14805D; --g5:#12C98A; --g4:#7CF0C0;
  --g2:#CDEBDD; --g1:#E7F5EF; --g0:#F3FAF6;
  --sb1:#EFFBF6; --sb2:#E1F5EC; --sbt:#0F3D2E; --sbd:#5C8677;
  --ink:#0D1A14; --ink2:#2B3A33; --mut:#4C5C55; --mut2:#6A7A72;
  --line:#E4EAE6; --line2:#F0F3F1; --bg:#F4F7F4; --card:#fff;
  --amber:#9A6700; --amberbg:#FFF3D6; --blue:#1D4ED8; --bluebg:#E8EEFD;
  --violet:#6D28D9; --violetbg:#F1EBFE; --red:#C0392B; --redbg:#FDECEA;
  --acc:#0F8A5F; --apo:#D98A00; --track:#E3EAE6;
  --wa:#EFE9E0; --wa-me:#D9FDD3;
  --fs-xs:9px; --fs-sm:10px; --fs-md:11px; --fs-lg:12px; --fs-xl:13px;
  --ease:cubic-bezier(.4,0,.2,1); --pop:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-weight:500;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--g5);outline-offset:2px;border-radius:8px}
.ic{display:block;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.sp{flex:1}

/* ---------- 2) اللوحة الثابتة (canvas) تُكبَّر وتُصغَّر لتناسب الإطار ---------- */
#app{position:fixed;inset:0;overflow:hidden}
.cmp #app{top:42px}
.cv{position:absolute;top:0;left:0;width:1040px;height:645px;transform-origin:0 0;visibility:hidden}
.cv.ready{visibility:visible}
.cv.pt{width:420px;height:812px}

/* ---------- 3) شريط الفصول ---------- */
.rail{position:absolute;top:14px;right:16px;left:16px;height:58px;display:flex;gap:4px;padding:4px;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,61,46,.05)}
.ri{flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:10px;
  text-align:start;color:var(--ink2);transition:background .25s var(--ease),color .25s}
.ri .ic{color:var(--g7);transition:color .25s}
.ri b{display:block;font-size:var(--fs-lg);font-weight:700;line-height:1.3}
.ri small{display:block;font-size:var(--fs-sm);color:var(--mut);font-weight:600;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri span{min-width:0}
.ri:hover{background:var(--g1)}
.ri.on{background:var(--g8);color:#fff}
.ri.on .ic{color:var(--g4)}
.ri.on small{color:#A9DCC5}
.ri .pg{position:absolute;inset-inline:14px;bottom:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.16);opacity:0;transition:opacity .2s}
.ri.on .pg{opacity:1}
.ri .pg i{display:block;height:100%;width:0;border-radius:2px;background:var(--g4)}
.cv.paused .ri.on .pg i{background:#A9DCC5}

/* ---------- 4) نافذة لوحة التحكم ---------- */
.win{position:absolute;top:80px;right:16px;left:276px;height:464px;display:flex;background:#fff;
  border:1px solid #DCE5E0;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,61,46,.05),0 26px 50px -30px rgba(11,61,46,.38);
  transition:left .5s var(--ease)}
.cv.nophone .win{left:16px}

/* الشريط الجانبي (مختصر بالأيقونات — نفس ألوان المنصة) */
.sb{width:50px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;
  background:linear-gradient(180deg,var(--sb1),var(--sb2));border-inline-end:1px solid var(--line)}
.sb-logo{width:30px;height:30px;margin-bottom:8px;display:grid;place-items:center}
.sb-logo img{width:30px;height:auto;display:block}
.sb-i{position:relative;z-index:1;width:36px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--sbd);transition:color .3s}
.sb-i.on{color:var(--g4)}
.sb-ind{position:absolute;z-index:0;left:7px;width:36px;height:32px;border-radius:9px;top:0;
  background:linear-gradient(90deg,#14664B,#1B8560);box-shadow:0 3px 10px rgba(18,201,138,.25);transition:top .45s var(--ease)}
.sb-new{position:absolute;top:3px;left:4px;width:6px;height:6px;border-radius:50%;background:#F2B65E}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{height:44px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:5px;font-size:var(--fs-lg);font-weight:700;color:var(--ink);white-space:nowrap}
.crumb .m{color:var(--mut);font-weight:600}
.crumb .ic{color:var(--mut2)}
.chip{height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border:1px solid var(--line);border-radius:8px;
  font-size:var(--fs-sm);color:var(--ink2);white-space:nowrap;font-weight:600}
.chip b{color:var(--g7);font-weight:700}
.chip.demo{background:var(--amberbg);border-color:#F1DDA6;color:var(--amber);font-weight:700}
.tbi{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.tbi .bd{position:absolute;top:-6px;left:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--g7);color:#fff;
  font-size:var(--fs-xs);font-weight:700;display:grid;place-items:center;border:2px solid #fff;line-height:1}
.ava{width:28px;height:28px;border-radius:50%;background:var(--g7);color:#fff;font-weight:700;font-size:var(--fs-md);display:grid;place-items:center;flex:none}
.content{flex:1;min-height:0;position:relative;background:#F7F9F8}
.view{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility 0s .28s}
.view.on{opacity:1;visibility:visible;transition:opacity .28s var(--ease)}
.win.swap .view.on{opacity:0}

/* ---------- 5) الشرح أسفل النافذة ---------- */
.cap{position:absolute;top:552px;right:16px;left:276px;height:80px;display:flex;align-items:center;gap:14px;padding:0 16px 0 10px;
  background:#fff;border:1px solid var(--line);border-radius:14px;transition:left .5s var(--ease)}
.cv.nophone .cap{left:16px}
.cap-ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--g1);color:var(--g7);display:grid;place-items:center}
.cap-tx{flex:1;min-width:0}
.cap-pr{font-size:var(--fs-lg);font-weight:700;color:var(--g9);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-bt{font-size:var(--fs-md);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;color:var(--ink2);line-height:1.6;transition:opacity .22s,transform .22s}
.cap-bt.out{opacity:0;transform:translateY(3px)}
.ctl{display:flex;align-items:center;gap:6px;flex:none}
.cb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);background:#fff}
.cb:hover{background:var(--g1);border-color:var(--g2)}
.cb.pp{background:var(--g7);border-color:var(--g7);color:#fff}
.cb.pp:hover{background:var(--g8)}
.dots{display:flex;gap:4px;align-items:center;padding:0 4px}
.dt{width:7px;height:7px;border-radius:4px;background:#CFDAD4;transition:width .3s var(--ease),background .3s}
.dt.on{width:20px;background:var(--g7)}
.dt.done{background:#8CC9AE}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 6) جوال العميل (واتساب) ---------- */
.phone{position:absolute;left:16px;top:84px;width:246px;height:524px;border-radius:38px;background:#101A16;padding:7px;
  box-shadow:0 34px 60px -26px rgba(11,40,30,.5),inset 0 0 0 1px rgba(255,255,255,.06);
  transition:transform .5s var(--ease),opacity .4s var(--ease);z-index:5}
.cv.nophone .phone{transform:translateX(-40px);opacity:0;pointer-events:none}
.ph-label{position:absolute;top:100%;left:0;right:0;margin-top:8px;text-align:center;font-size:var(--fs-sm);font-weight:600;color:var(--mut);line-height:1.4;white-space:nowrap}
.ph-scr{position:relative;width:100%;height:100%;border-radius:31px;overflow:hidden;background:var(--wa);display:flex;flex-direction:column}
.ph-st{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 20px 0;font-size:var(--fs-sm);font-weight:700;color:#111;background:#F6F4F0;direction:ltr}
.ph-st .isl{width:62px;height:18px;border-radius:12px;background:#101A16}
.ph-hd{height:44px;flex:none;display:flex;align-items:center;gap:7px;padding:0 8px;background:#F6F4F0;border-bottom:1px solid #E6E0D5;color:#1F2A26}
.ph-av{width:30px;height:30px;border-radius:50%;background:var(--g7);color:#fff;display:grid;place-items:center;font-weight:700;font-size:var(--fs-lg);flex:none}
.ph-nm{font-size:var(--fs-lg);font-weight:700;line-height:1.2}
.ph-sub{font-size:var(--fs-xs);color:var(--mut);font-weight:600;line-height:1.2}
.ph-bd{flex:1;position:relative;overflow:hidden;
  background-color:var(--wa);background-image:radial-gradient(#DCD3C6 1px,transparent 1px);background-size:18px 18px}
.ph-th{position:absolute;inset:0;padding:10px 8px;display:none;flex-direction:column;justify-content:flex-end;gap:6px}
.ph-th.on{display:flex}
.ph-cp{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:#F6F4F0}
.ph-in{flex:1;height:32px;border-radius:16px;background:#fff;font-size:var(--fs-sm);color:#98A19D;display:flex;align-items:center;padding:0 12px}
.ph-mic{width:32px;height:32px;border-radius:50%;background:#1A9E6E;display:grid;place-items:center;color:#fff;flex:none}
.pday{align-self:center;font-size:var(--fs-xs);font-weight:600;color:#5E6B66;background:#FFFFFFD9;border-radius:7px;padding:2px 9px;margin:2px 0}
.pb{max-width:90%;flex:none;font-size:var(--fs-sm);line-height:1.55;padding:6px 8px 4px;border-radius:10px;background:#fff;color:#16201C;
  box-shadow:0 1px .5px rgba(0,0,0,.1);white-space:pre-line;position:relative}
.pb.me{align-self:flex-end;background:var(--wa-me);border-top-left-radius:3px}
.pb.biz{align-self:flex-start;border-top-right-radius:3px}
.pb .tm{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:var(--fs-xs);color:#7A8580;margin-top:1px;white-space:nowrap}
.pb .tm .ic{color:#4FA8D8}
.pb.media{padding:3px;width:86%}
.pb.media .cap2{padding:5px 6px 2px}
.pb .med{display:block;width:100%;border-radius:7px;overflow:hidden}
.pb .med svg{display:block;width:100%;height:auto}
.pb .ft{font-size:var(--fs-xs);color:#7A8580;padding:0 6px}
.pbtn{align-self:flex-start;width:86%;flex:none;display:flex;gap:4px;margin-top:-3px}
.pbtn span{flex:1;height:30px;display:flex;align-items:center;justify-content:center;gap:5px;background:#fff;border-radius:8px;
  font-size:var(--fs-sm);font-weight:600;color:#027EB5;box-shadow:0 1px .5px rgba(0,0,0,.1)}
.qrwrap{position:relative}
.scanbar{position:absolute;left:33.3%;width:33.4%;top:33.3%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#12C98A,transparent);
  box-shadow:0 0 10px 2px rgba(18,201,138,.55);opacity:0}
.scan .scanbar{animation:scan 1.4s var(--ease) both}
@keyframes scan{0%{opacity:0;top:33.5%}15%{opacity:1}85%{opacity:1}100%{opacity:0;top:65.5%}}

/* ---------- 7) الإبراز والإشعار ---------- */
.ring{position:absolute;z-index:60;border-radius:12px;pointer-events:none;opacity:0;
  box-shadow:0 0 0 2px var(--g5),0 0 0 6px rgba(18,201,138,.2);
  transition:left .5s var(--ease),top .5s var(--ease),width .5s var(--ease),height .5s var(--ease),opacity .3s}
.ring.on{opacity:1}
.ring.pulse::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--g5);animation:rp .9s ease-out both}
@keyframes rp{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.07)}}
.toast{position:absolute;bottom:12px;left:50%;z-index:30;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:7px;background:#12231C;color:#fff;font-size:var(--fs-md);font-weight:600;padding:8px 13px;border-radius:10px;
  white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.35);transition:opacity .3s,transform .3s var(--ease)}
.toast .ic{color:var(--g4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.press{animation:press .45s var(--ease)}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.9);filter:brightness(.92)}100%{transform:scale(1)}}

/* ظهور العناصر حسب خطوات القصة (data-on / data-off) */
[data-on]:not(.shown){display:none!important}
[data-on].enter{animation:rin .42s var(--pop) both}
[data-off].gone{display:none!important}
@keyframes rin{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.instant,.instant *{transition:none!important;animation:none!important}

/* ---------- 8) عناصر مشتركة داخل الشاشات ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.h5{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:var(--fs-md);font-weight:700;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:99px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap;line-height:1}
.p-ok{background:#E3F5EA;color:#116B43}.p-warn{background:var(--amberbg);color:var(--amber)}.p-mut{background:var(--line2);color:var(--mut)}
.p-vio{background:var(--violetbg);color:var(--violet)}.p-blue{background:var(--bluebg);color:var(--blue)}.p-red{background:var(--redbg);color:var(--red)}
.p-g{background:var(--g1);color:var(--g7)}
.cat-mk{background:var(--violetbg);color:var(--violet)}.cat-ut{background:var(--amberbg);color:var(--amber)}
.cat-au{background:var(--bluebg);color:var(--blue)}.cat-in{background:var(--g1);color:var(--g7)}
.btn{height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 11px;border-radius:8px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.btn-p{background:var(--g7);color:#fff}.btn-g{border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btn-i{background:#3B2E8F;color:#fff}
.pg-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pg-hd h3{margin:0;font-size:var(--fs-xl);font-weight:700;display:flex;align-items:center;gap:7px}
.cnt{background:#2B3038;color:#fff;font-size:var(--fs-sm);font-weight:700;padding:1px 7px;border-radius:6px;line-height:1.6}
.srch{height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:var(--fs-sm);color:var(--mut2);min-width:150px}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{font-weight:700;color:var(--ink2);text-align:start;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFCFB}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--fs-xs);direction:ltr;unicode-bidi:isolate;color:var(--ink2)}
.kb{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--ink2);background:#fff}
.av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:var(--fs-md);display:grid;place-items:center;flex:none}
.av.sm{width:20px;height:20px;font-size:var(--fs-xs)}
.bar{display:block;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--g7);transition:width .9s var(--ease)}

/* ---------- 9) فصل المحادثات ---------- */
.ib{height:100%;display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ib-list{width:228px;flex:none;display:flex;flex-direction:column;border-inline-end:1px solid var(--line)}
.ib-lh{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 6px}
.ib-lh b{display:block;font-size:var(--fs-lg);font-weight:700}
.ib-lh small{display:block;font-size:var(--fs-xs);color:var(--mut)}
.addb{width:26px;height:26px;border-radius:8px;background:var(--g7);color:#fff;display:grid;place-items:center;margin-inline-start:auto}
.ib-s{margin:0 10px 6px;height:30px;border-radius:99px;background:#F2F4F3;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:var(--fs-xs);color:var(--mut2);white-space:nowrap;overflow:hidden}
.ib-tabs{display:flex;gap:4px;padding:0 8px 8px;overflow:hidden;white-space:nowrap}
.ib-tabs>span{flex:none;padding:2px 6px;border-radius:99px;font-size:var(--fs-xs);font-weight:700;background:var(--line2);color:var(--mut)}
.ib-tabs>span.on{background:var(--g7);color:#fff}
.ib-items{flex:1;overflow:hidden;border-top:1px solid var(--line2)}
.ci{display:flex;gap:9px;padding:11px 12px;border-bottom:1px solid var(--line2);border-inline-start:3px solid transparent;transition:background .3s}
.ci .cbx{flex:1;min-width:0}
.ci .ct{display:flex;align-items:center;gap:5px}
.ci .ct b{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ty{flex:none;font-size:var(--fs-xs);font-weight:700;color:#8A5A00;background:var(--amberbg);border-radius:5px;padding:0 5px;line-height:1.7}
.ci .tm{margin-inline-start:auto;flex:none;font-size:var(--fs-xs);color:var(--mut2)}
.ci .cp{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--mut);margin-top:1px}
.ci .cp>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .cm{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:3px}
.ub{flex:none;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--g7);color:#fff;font-size:var(--fs-xs);font-weight:700;display:grid;place-items:center}
.tg{display:inline-flex;align-items:center;height:17px;padding:0 7px;border-radius:99px;font-size:var(--fs-xs);font-weight:700}
.tg-blue{background:var(--bluebg);color:var(--blue)}.tg-amb{background:var(--amberbg);color:var(--amber)}.tg-grn{background:var(--g1);color:var(--g7)}
.v-chats.opened .c1-new{background:#E9F7F0;border-inline-start-color:var(--g7)}
.th{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.th-empty{flex:1;display:grid;place-items:center;align-content:center;gap:6px;color:var(--mut2);font-size:var(--fs-sm);font-weight:600;
  background:var(--wa);background-image:radial-gradient(#DCD3C6 1px,transparent 1px);background-size:18px 18px}
.th-in{flex:1;min-height:0;display:flex;flex-direction:column}
.th-hd{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
.th-hd b{display:block;font-size:var(--fs-md);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-hd small{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--mut);margin-top:1px}
.th-bd{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;padding:12px 12px;
  background:var(--wa);background-image:radial-gradient(#DCD3C6 1px,transparent 1px);background-size:18px 18px}
.mb{max-width:90%;font-size:var(--fs-sm);line-height:1.55;padding:6px 9px 4px;border-radius:10px;background:#fff;box-shadow:0 1px .5px rgba(0,0,0,.08)}
.mb.in{align-self:flex-end;border-top-left-radius:3px}
.mb.out{align-self:flex-start;background:#DDF6E7;border-top-right-radius:3px}
.mb i{display:block;font-style:normal;font-size:var(--fs-xs);color:var(--mut2);text-align:end}
.mb .sb2{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:var(--fs-xs);color:#4F7A66;margin-top:2px}
.mb .sb2 .ic{color:#4FA8D8}
.th-cp{display:flex;align-items:center;gap:5px;padding:7px 8px;border-top:1px solid var(--line);background:#fff}
.th-cp .cbt{width:28px;height:28px;flex:none;border-radius:8px;background:var(--line2);display:grid;place-items:center;color:var(--ink2)}
.th-cp .cbt.ai{background:linear-gradient(135deg,#EAF8F1,#E8EEFD);color:var(--g7)}
.inp{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;padding:0 9px;font-size:var(--fs-xs);overflow:hidden}
.inp .phd{color:var(--mut2);white-space:nowrap}
.inp .tx{white-space:nowrap;color:var(--ink);direction:rtl;overflow:hidden;text-overflow:ellipsis}
.v-chats.typing .inp{border-color:var(--g5);box-shadow:0 0 0 3px rgba(18,201,138,.15)}
.go{height:28px;padding:0 10px;border-radius:8px;background:var(--g7);color:#fff;font-size:var(--fs-sm);font-weight:700;display:grid;place-items:center;flex:none}
.det{width:186px;flex:none;border-inline-start:1px solid var(--line);padding:4px 10px;background:#FCFDFC;overflow:hidden}
.det section{padding:9px 0;border-bottom:1px solid var(--line2)}
.det section:last-child{border-bottom:0}
.det .h5{margin-bottom:5px;justify-content:space-between}
.det .h5 a{font-size:var(--fs-xs);color:var(--g7);font-weight:700}
.det p{margin:0;font-size:var(--fs-sm);color:var(--ink2);display:flex;align-items:center;gap:5px}
.det small{display:block;font-size:var(--fs-xs);color:var(--mut);margin-top:2px}
.det .lk{font-size:var(--fs-xs);color:var(--g7);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.lockt{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.note{background:var(--amberbg);border-radius:8px;padding:5px 7px;font-size:var(--fs-xs);line-height:1.55;margin:4px 0}
.note b{color:var(--g7)}
.men{color:var(--blue);font-weight:700}
.inl{height:24px;border:1px solid var(--line);border-radius:7px;font-size:var(--fs-xs);color:var(--mut2);display:flex;align-items:center;padding:0 8px;margin-top:4px;background:#fff}
.mini{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:700;color:var(--g7);margin-inline-start:6px}
.task{display:flex;align-items:center;gap:5px;margin-top:5px;padding:5px 7px;border-radius:8px;background:var(--bluebg);font-size:var(--fs-xs);font-weight:600;color:#173A8A}
.task small{margin:0 auto 0 0;color:#3D5BA8;font-weight:600}

/* ---------- 10) فصل الحملات ---------- */
.tp{flex:1;min-height:0;display:flex;flex-direction:column}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}
.ftabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin:0 0 8px;font-size:var(--fs-sm);font-weight:600;color:var(--mut)}
.ftabs span{padding:3px 0 6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ftabs span.on{color:var(--g7);border-bottom-color:var(--g7);font-weight:700}
.tcard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
.tprev{flex:1;min-height:0;position:relative;padding:22px 10px 8px;overflow:hidden;
  background:var(--wa);background-image:radial-gradient(#DCD3C6 1px,transparent 1px);background-size:18px 18px}
.tprev::after{content:'';position:absolute;inset:auto 0 0 0;height:26px;background:linear-gradient(transparent,var(--wa))}
.rib{position:absolute;top:6px;left:6px;z-index:2;font-size:var(--fs-xs);font-weight:700;color:#fff;border-radius:5px;padding:1px 7px}
.rib.meta{background:#2563EB}.rib.qr{background:#7C3AED}
.tbub{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tbub>svg{display:block;width:100%;height:auto}
.tbub .bt{padding:6px 8px;font-size:var(--fs-xs);line-height:1.65;white-space:pre-line;color:#2F3833}
.tbub .ft{padding:0 8px 4px;font-size:var(--fs-xs);color:var(--mut2)}
.tbub .ba{border-top:1px solid #EDEEF1;padding:5px;text-align:center;font-size:var(--fs-xs);font-weight:600;color:#027EB5;display:flex;align-items:center;justify-content:center;gap:4px}
.var{background:#DBEAFE;color:#1D4ED8;border-radius:3px;padding:0 3px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.tmeta{padding:7px 9px;border-top:1px solid var(--line)}
.tmeta .r{display:flex;align-items:center;gap:6px}
.tmeta .mono{margin-inline-start:auto;font-weight:600;color:var(--ink);font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.tmeta .r+.r{margin-top:5px}
.tfoot{display:flex;border-top:1px solid var(--line)}
.tfoot span{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 2px;font-size:var(--fs-xs);color:var(--ink2);font-weight:600}
.tfoot span+span{border-inline-start:1px solid var(--line)}
.tfoot .snd{color:var(--g7)}
.sheet{position:absolute;inset:10px 10px 10px auto;width:62%;z-index:6;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 20px 40px -18px rgba(11,40,30,.35)}
.v-camp.shOpen .shade,.v-ev.drOpen .shade,.v-an.roles .shade{opacity:1}
.shade{position:absolute;inset:0;background:rgba(13,26,20,.18);opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;border-radius:0}
.v-camp .sheet{inset:10px auto 10px 10px}
.sh-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh-hd b{font-size:var(--fs-lg);font-weight:700}
.sh-sec{padding:10px 12px 4px}
.sh-sec label{display:block;font-size:var(--fs-sm);font-weight:700;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:var(--fs-sm);font-weight:700;color:var(--ink2);transition:border-color .3s,background .3s}
.opt .ic{color:var(--g7);margin-bottom:3px}
.opt small{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--mut);margin-top:1px}
.v-camp.pick #c2OptC{border-color:var(--g5);background:#F1FBF6;box-shadow:0 0 0 2px rgba(18,201,138,.18)}
.grp{margin-top:7px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:var(--fs-sm);color:var(--ink2)}
.grp b{font-weight:700;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg span{padding:3px 12px;border-radius:7px;font-size:var(--fs-sm);font-weight:700;color:var(--mut)}
.seg span.on{background:var(--g7);color:#fff}
.fld{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:var(--fs-sm);color:var(--ink2)}
.sh-ft{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.sh-ft .btn{height:32px;flex:1;justify-content:center;font-size:var(--fs-md)}
.ob{position:absolute;inset:10px}
.v-camp.outbox .tp{display:none}
.ob .card{overflow:hidden}
.v-camp .newrow td{background:#F1FBF6}
.ob .c-id{display:none}
.ob .tbl th,.ob .tbl td{padding:10px 7px;font-size:var(--fs-sm)}
.ob .mono{font-size:var(--fs-xs)}

/* ---------- 11) فصل الدعوات ---------- */
.dh{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.dh h3{margin:0;font-size:var(--fs-lg);font-weight:700}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;font-size:var(--fs-xs);color:var(--mut);margin-bottom:6px}
.dmeta b{color:var(--ink2);font-weight:700}
.dtabs{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:8px;font-size:var(--fs-sm);font-weight:600;color:var(--mut)}
.dtabs>span{padding:3px 0 6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs .t-gen,.v-inv.gtab .t-gst{color:var(--g7);border-bottom-color:var(--g7);font-weight:700}
.v-inv.gtab .t-gen{color:var(--mut);border-bottom-color:transparent;font-weight:600}
.phase{margin-inline-start:auto;margin-bottom:4px}
.dgen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;flex:1;min-height:0}
.v-inv.gtab .dgen{display:none}
.dgst{display:none;flex:1;min-height:0}
.v-inv.gtab .dgst{display:flex;flex-direction:column;gap:8px}
.gtbl td,.gtbl th{padding:9px 10px}
.gtbl tbody tr:nth-child(n+5){display:none}
.ccard{padding:14px 15px;display:flex;flex-direction:column;min-height:0}
.cols{flex:1;min-height:70px;display:flex;align-items:flex-end;gap:10px;padding:4px 4px 0;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(to top,transparent 0 24px,var(--line2) 24px 25px)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.col b{font-size:var(--fs-sm);font-weight:700;color:var(--ink)}
.col i{display:block;width:100%;max-width:30px;height:0;border-radius:5px 5px 0 0;background:var(--g7);transition:height .9s var(--ease)}
.colx{display:flex;gap:10px;padding:5px 4px 0}
.colx span{flex:1;text-align:center;font-size:var(--fs-xs);font-weight:600;color:var(--mut)}
.dn2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.dn2 .leg{width:100%}
.foot{font-size:var(--fs-xs);margin-top:8px;line-height:1.5}
.foot b{color:var(--ink);font-weight:700}
.dn{display:flex;align-items:center;gap:10px}
.dn svg{flex:none}
.leg{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-xs);color:var(--ink2);min-width:0}
.leg div{display:flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:3px;flex:none}
.leg b{margin-inline-start:auto;font-weight:700;color:var(--ink);padding-inline-start:6px}
.bigc{font-size:15px;font-weight:700;fill:var(--ink)}
.smc{font-size:var(--fs-xs);font-weight:600;fill:var(--mut)}
.arc{transition:stroke-dasharray .9s var(--ease),stroke-dashoffset .9s var(--ease)}
.gstrip{display:flex;gap:8px}
.gstrip .card{flex:1;padding:7px 10px;font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.gstrip .card b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.v-inv .nrow td{background:#F1FBF6}
.chkp{display:inline-flex;align-items:center;gap:4px;color:#116B43;font-weight:700}
.chkp small{font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.qrok{color:var(--g7)}

/* ---------- 12) فصل الفعاليات ---------- */
.kbnote{display:flex;align-items:center;gap:7px;background:var(--g0);border:1px solid var(--g2);border-radius:9px;padding:6px 10px;font-size:var(--fs-sm);color:var(--sbt);margin-bottom:8px}
.kbnote b{font-weight:700}
.evt td{padding:10px 8px}
.evt .nm b{display:block;font-size:var(--fs-md);font-weight:700;color:var(--ink)}
.tk{display:flex;flex-direction:column;gap:4px;min-width:150px}
.tk small{font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.tk small b{color:var(--ink);font-weight:700}
.drawer{position:absolute;top:10px;bottom:10px;left:10px;width:64%;z-index:6;display:flex;flex-direction:column;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 40px -18px rgba(11,40,30,.35);overflow:hidden}
.dr-hd{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.dr-hd b{font-size:var(--fs-lg);font-weight:700}
.dr-tabs{display:flex;gap:12px;padding:8px 12px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);font-weight:600;color:var(--mut);white-space:nowrap}
.dr-tabs span{padding:2px 0 6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.dr-tabs .t-grp,.v-ev.gates .t-gat{color:var(--g7);border-bottom-color:var(--g7);font-weight:700}
.v-ev.gates .t-grp{color:var(--mut);border-bottom-color:transparent;font-weight:600}
.dr-bd{flex:1;padding:12px;min-height:0}
.dr-grp{display:flex;flex-direction:column;gap:12px}
.v-ev.gates .dr-grp{display:none}
.dr-gat{display:none}
.v-ev.gates .dr-gat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gline{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-sm);font-weight:700;margin-bottom:5px}
.gline small{font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.sumbox{display:flex;gap:8px}
.sumbox div{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.sumbox b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.plist{display:flex;flex-direction:column;gap:4px}
.plist div{display:flex;justify-content:space-between;font-size:var(--fs-xs);padding:4px 8px;border-radius:7px;background:#F7F9F8;color:var(--ink2)}
.plist b{font-weight:700}
.sup{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);padding:4px 0;border-bottom:1px solid var(--line2)}
.sup:last-child{border-bottom:0}
.sup small{margin-inline-start:auto;color:var(--mut);font-size:var(--fs-xs)}
.kmenu{position:absolute;z-index:7;width:178px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px -10px rgba(0,0,0,.25);padding:4px}
.kmenu div{padding:6px 9px;border-radius:7px;font-size:var(--fs-sm);font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kmenu .pub{color:var(--g7);font-weight:700}

/* ---------- 13) فصل التحليلات ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi{position:relative;overflow:hidden;padding:13px 15px 12px}
.kpi .kt{display:flex;align-items:center;gap:6px;font-size:var(--fs-md);font-weight:700;color:var(--ink2)}
.kpi .kt .ic{color:var(--g7)}
.kpi .kv{font-size:17px;font-weight:700;line-height:1.2;margin:1px 0 3px;color:var(--ink)}
.kpi .kr{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--mut);font-weight:600;line-height:1.6}
.kpi .kr b{color:var(--ink2);font-weight:700}
.arow{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;flex:1;min-height:0}
.cbar{display:grid;grid-template-columns:104px 1fr 70px;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--ink2);margin:7px 0}
.cbar b{font-weight:700;color:var(--ink);text-align:end;white-space:nowrap}
.cbar b small{color:var(--mut);font-weight:600;font-size:var(--fs-xs)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:#fff;margin:6px 0 8px}
.stack i{display:block;height:100%;transition:width .9s var(--ease)}
.lg2{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--ink2);font-weight:600}
.lg2 span{display:flex;align-items:center;gap:5px}
.lg2 i{width:9px;height:9px;border-radius:3px}
.lg2 b{font-weight:700;color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.trio div{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.trio b{display:block;font-size:var(--fs-xl);color:var(--ink);font-weight:700}
.rsheet{position:absolute;bottom:10px;left:10px;width:60%;top:128px;z-index:6;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 20px 40px -18px rgba(11,40,30,.35);padding:10px 12px;display:flex;flex-direction:column}
.role{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2)}
.role:last-of-type{border-bottom:0}
.role .rn{width:92px;flex:none;font-size:var(--fs-sm);font-weight:700}
.role .rn small{display:block;font-size:var(--fs-xs);color:var(--mut);font-weight:600}
.role .rp{display:flex;flex-wrap:wrap;gap:4px}

/* =====================================================================
   14) التخطيط العمودي للجوال (portrait) — نفس المحتوى بترتيب عمودي
   ===================================================================== */
.cv.pt .rail{top:12px;right:12px;left:12px;height:58px;gap:2px;padding:3px}
.cv.pt .ri{flex-direction:column;justify-content:center;gap:3px;padding:0 2px;text-align:center}
.cv.pt .ri b{font-size:var(--fs-sm)}
.cv.pt .ri small{display:none}
.cv.pt .ri .pg{inset-inline:8px;bottom:3px}
.cv.pt .win,.cv.pt.nophone .win{top:80px;right:12px;left:12px;height:560px}
.cv.pt .sb{display:none}
.cv:not(.nophone) .tb .ch-tpl,.cv:not(.nophone) .tb .tbi.tsk,.cv.pt .tb .ch-tpl,.cv.pt .tb .ch-lim,.cv.pt .tb .tbi.tsk{display:none}
.cv.pt .cap,.cv.pt.nophone .cap{top:650px;right:12px;left:12px;height:150px;flex-wrap:wrap;align-content:center;gap:6px 10px;padding:8px 12px}
.cv.pt .cap-ic{display:none}
.cv.pt .cap-tx{flex:1 1 100%}
.cv.pt .cap-pr{white-space:normal;font-size:var(--fs-lg)}
.cv.pt .ctl{width:100%;justify-content:space-between}
/* الجوال في الوضع العمودي يظهر بالمقدّمة فقط عندما تكون القصة عند العميل */
.cv.pt .phone{z-index:50;left:87px;top:96px;transform:translateY(40px) scale(.94);opacity:0;pointer-events:none}
.cv.pt.fphone:not(.nophone) .phone{transform:none;opacity:1}
.cv.pt .win::after{content:'';position:absolute;inset:0;background:rgba(244,247,244,.72);backdrop-filter:blur(1.5px);opacity:0;transition:opacity .35s;pointer-events:none;z-index:20}
.cv.pt.fphone:not(.nophone) .win::after{opacity:1}
/* المحادثات */
.cv.pt .ib{flex-direction:column}
.cv.pt .ib-list{width:auto;flex:1;border-inline-end:0}
.cv.pt .v-chats.opened .ib-list{display:none}
.cv.pt .th{display:none}
.cv.pt .v-chats.opened .th{display:flex;flex:1}
.cv.pt .det{display:none}
.cv.pt .v-chats.opened .det{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;width:auto;flex:none;border-inline-start:0;border-top:1px solid var(--line);padding:2px 10px}
.cv.pt .ci{padding:10px 12px}
.cv.pt .ci .ct b{font-size:var(--fs-md)}
.cv.pt .ci .cp{font-size:var(--fs-sm)}
/* الحملات */
.cv.pt .tgrid{grid-template-columns:1fr}
.cv.pt .tgrid .tcard:not(#c2Card){display:none}
.cv.pt .pg-hd .btn-g,.cv.pt .pg-hd .srch{display:none}

/* =====================================================================
   تلميحات التفاعل (Discoverability) — 5 مقترحات + التوصية.  تُفعَّل بـ ?hint=0..6
   ===================================================================== */
.sb{z-index:20}
.sb-i.act{cursor:pointer}
.sb-i.act:hover{background:rgba(15,107,78,.09)}
.sb-i.act:focus-visible{outline:2px solid var(--g5);outline-offset:1px}
.sb-i.on.act:hover{background:none}
.sb-i.rip::after{content:"";position:absolute;inset:0;border-radius:9px;border:2px solid var(--g5);animation:ripx .55s var(--ease) forwards;pointer-events:none}
@keyframes ripx{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.5)}}

/* تلميح اسم القسم عند المرور (يظهر على يسار الأيقونة، فوق المحتوى مؤقتاً) */
.h-tip .sb-i.act::before{content:attr(data-l);position:absolute;right:calc(100% + 10px);top:50%;transform:translate(4px,-50%);
  background:var(--g9);color:#fff;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;padding:4px 9px;border-radius:7px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:30}
.h-tip .sb-i.act:hover::before,.h-tip .sb-i.act:focus-visible::before{opacity:1;transform:translate(0,-50%)}

/* مقترح 2 — أيقونات تبدو كأزرار: الفعّالة واضحة، والبقية خافتة */
.h-aff .sb-i.act{background:rgba(15,107,78,.07);box-shadow:inset 0 0 0 1px rgba(15,107,78,.22);color:var(--g7)}
.h-aff .sb-i.act.on{box-shadow:none;color:var(--g4)}
.h-aff .sb-i.act:hover{transform:translateX(-2px);background:rgba(15,107,78,.14)}
.h-aff .sb-i.act.on:hover{transform:none}
.h-aff .sb-i.dis{opacity:.32}
.h-aff .sb-i.act:not(.on)::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--g5)}

/* مقترح 1 — مؤشر يقوم بأول نقرة */
.ghost{position:absolute;z-index:80;left:0;top:0;width:22px;height:22px;pointer-events:none;opacity:0;
  transition:transform 1.15s var(--ease),opacity .35s;filter:drop-shadow(0 3px 5px rgba(11,61,46,.35))}
.ghost.on{opacity:1}
.ghost.press svg{animation:press .3s var(--ease)}

/* مقترح 3 — نبضة + وسم صغير على القسم التالي */
.sb-i.nudge::after,.ri.nudge::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:1.5px solid var(--g5);
  animation:halo 1.3s ease-out 2;pointer-events:none}
@keyframes halo{0%{opacity:.95;transform:scale(.85)}100%{opacity:0;transform:scale(1.4)}}
.tag{position:absolute;z-index:70;left:0;top:0;background:var(--g9);color:#fff;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;
  padding:4px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 6px 16px -6px rgba(11,61,46,.5)}
.tag.on{opacity:1}
.tag::before{content:"";position:absolute;left:100%;top:50%;margin-top:-5px;border:5px solid transparent;border-left-color:var(--g9)}
.tag.dn::before{left:50%;margin-left:-5px;top:auto;bottom:100%;margin-top:0;border-left-color:transparent;border-bottom-color:var(--g9)}

/* مقترح 4 — منطقة تفاعلية عند المرور */
.h-hover .win{transition:box-shadow .25s,left .5s var(--ease)}
.h-hover .win:hover{box-shadow:0 0 0 2px rgba(18,201,138,.55),0 26px 50px -30px rgba(11,61,46,.38)}
.h-hover .win:hover .sb-i.act:not(.on){animation:breathe 1.6s var(--ease) 1}
@keyframes breathe{0%,100%{background:transparent}40%{background:rgba(18,201,138,.22)}}

/* مقترح 5 — سطر إرشاد داخل شريط الشرح (بدون أي عنصر جديد فوق اللوحة) */
.cap-tx{position:relative}
.cap-hint{position:absolute;inset:0;display:flex;align-items:center;gap:9px;font-size:var(--fs-md);font-weight:700;color:var(--g7);

}

<script>
/* =====================================================================
   A) البيانات التجريبية — مصدر واحد لكل الأرقام
   كل رقم معروض في الجولة يأتي من هنا، والعلاقات بينها مضمونة
   (انظر checkDemo() في الأسفل: تُشغَّل تلقائياً مع ?debug=1).
   الأسماء والأرقام كلها وهمية، والجوالات مخفية جزئياً.
   ===================================================================== */
const DEMO = {
  team:{ me:'حسان الأحمد', lina:'لينا السبيعي', majed:'ماجد الحربي' },
  ai:{ before:65, after:66 },          // نسبة رصيد الذكاء الاصطناعي المستهلك
  dailyLimit:2000,

  /* المحادثات حسب نوع الطرف (تظهر في التحليلات وعدّاد صندوق المحادثات) */
  chatsByParty:{ contacts:1180, users:24, external:436, organizers:38 },

  /* فصل الدعوات: دعوة زفاف مدمجة مع QR */
  invite:{
    invitees:240,
    before:{ sent:240, delivered:236, read:220, replies:197, accepted:171, apologized:26, noReply:43 },
    after: { sent:240, delivered:236, read:221, replies:198, accepted:172, apologized:26, noReply:42 },
    eventDay:{ presentBefore:157, presentAfter:158 },
  },

  /* فصل الحملات */
  campaign:{ vipGroup:412, replies:57, teaserSent:1240, teaserReplies:96, bookingSent:318, bookingReplies:41 },

  /* فصل الفعاليات */
  events:[
    { name:'ملتقى رواد الضيافة', code:'EV-318274', start:'20/11/2026', end:'22/11/2026', periods:6, total:1500, booked:1240, status:'نشطة', pub:'منشورة' },
    { name:'مهرجان ليالي الشتاء', code:'EV-204518', start:'10/12/2026', end:'14/12/2026', periods:10, total:3000, booked:0, status:'نشطة', pub:'مسودة' },
    { name:'معرض التقنية للمنشآت', code:'EV-098732', start:'02/09/2026', end:'04/09/2026', periods:3, total:800, booked:800, status:'منتهية', pub:'منشورة' },
  ],
  ticketGroups:[ { name:'عام', total:1200, booked:1010 }, { name:'كبار الشخصيات', total:300, booked:230 } ],
  gates:{ count:8, max:20 },

  /* فصل التحليلات */
  users:{ active:13, inactive:1 },
  contacts:{ total:2486, today:12, week:87, month:342 },
  organizers:{ active:7, inactive:2 },
  byCategory:[ ['تسويق',1040], ['أدوات مساعدة',620], ['خدمة دعم العملاء',880], ['التحقق / المصادقة',160] ],
  tplChats:{ paid:1760, free:940, today:64, week:410, month:1690 },
  roles:[ ['المدير',2], ['خدمة العملاء',8], ['التسويق',4] ],
};
const sum = a => a.reduce((x,y)=>x+y,0);
const D = DEMO;
D.chatsTotal = sum(Object.values(D.chatsByParty));          // 1,678
D.catTotal   = sum(D.byCategory.map(c=>c[1]));              // 2,700
D.usersTotal = D.users.active + D.users.inactive;            // 14

/* فحص الاتساق — يُرجع قائمة بالمشاكل (فارغة = كل شيء متسق) */
function checkDemo(){
  const e=[]; const ok=(c,m)=>{ if(!c) e.push(m); };
  for(const k of ['before','after']){
    const s=D.invite[k];
    ok(s.accepted+s.apologized+s.noReply===D.invite.invitees, `invite.${k}: القبول+الاعتذار+بلا رد ≠ المدعوين`);
    ok(s.replies===s.accepted+s.apologized, `invite.${k}: الردود ≠ القبول+الاعتذار`);
    ok(s.sent>=s.delivered && s.delivered>=s.read && s.read>=s.replies, `invite.${k}: تسلسل الرسائل غير منطقي`);
    ok(s.sent===D.invite.invitees, `invite.${k}: المرسلة ≠ المدعوين`);
  }
  ok(D.invite.eventDay.presentAfter<=D.invite.after.accepted, 'الحاضرون أكثر من المقبولين');
  ok(D.campaign.vipGroup<=D.contacts.total && D.campaign.teaserSent<=D.contacts.total, 'المستلمون أكثر من جهات الاتصال');
  ok(D.campaign.replies<=D.campaign.vipGroup, 'ردود الحملة أكثر من الرسائل');
  ok(D.tplChats.paid+D.tplChats.free===D.catTotal, 'المدفوعة+المجانية ≠ الكل');
  ok(D.tplChats.today<=D.tplChats.week && D.tplChats.week<=D.tplChats.month && D.tplChats.month<=D.catTotal, 'اليوم/الأسبوع/الشهر غير متسلسلة');
  ok(D.tplChats.today<=D.dailyLimit, 'محادثات اليوم تتجاوز الحد اليومي');
  ok(D.contacts.week<=D.contacts.month && D.contacts.month<=D.contacts.total, 'إضافات جهات الاتصال غير منطقية');
  ok(sum(D.roles.map(r=>r[1]))===D.usersTotal, 'مجموع مستخدمي الأدوار ≠ المستخدمين');
  ok(sum(D.ticketGroups.map(g=>g.total))===D.events[0].total, 'مجموعات التذاكر ≠ إجمالي التذاكر');
  ok(sum(D.ticketGroups.map(g=>g.booked))===D.events[0].booked, 'المحجوز في المجموعات ≠ المحجوز');
  D.events.forEach(v=>ok(v.booked<=v.total, `${v.code}: المحجوز أكثر من الإجمالي`));
  ok(D.events[1].pub!=='مسودة' || D.events[1].booked===0, 'فعالية مسودة فيها حجوزات');
  ok(D.gates.count<=D.gates.max, 'مشرفو الدخول أكثر من الحد');
  return e;
}

/* بطاقة الدخول: 900×900 والمساحة البيضاء 300×300 في الوسط (حسب دليل المنصة) */
function qrModules(){
  const n=21, m=[]; let s=20261119; const rnd=()=> (s=(s*1103515245+12345)%2147483648)/2147483648;
  for(let y=0;y<n;y++){ m[y]=[]; for(let x=0;x<n;x++) m[y][x]= rnd()<.5; }
  const finder=(ox,oy)=>{ for(let y=-1;y<8;y++) for(let x=-1;x<8;x++){ const X=ox+x,Y=oy+y; if(X<0||Y<0||X>=n||Y>=n) continue;
    const d=Math.max(Math.abs(x-3),Math.abs(y-3)); m[Y][X]= (x>=0&&x<7&&y>=0&&y<7) ? (d!==2) : false; } };
  finder(0,0); finder(14,0); finder(0,14);
  for(let i=8;i<13;i++){ m[6][i]=i%2===0; m[i][6]=i%2===0; }
  return m;
}

const cv = $('#cv');
const S = { ch:0, beat:0, t:0, playing:true, userPaused:false, visible:true, gen:0, last:0, done:false, scale:1 };
const P = new URLSearchParams(location.search);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const OPT = { autoplay: P.get('autoplay')!=='0' && !RM, loop: P.get('loop')!=='0', layout: P.get('layout')||'auto', debug: P.has('debug'), compare: P.get('compare')==='1', hint: P.has('hint') ? +P.get('hint') : 7 };
let VALS = {};            // القيم الحالية للأرقام
let timers = [];
const roots = () => { const id=CHAPTERS[S.ch].id; return [ $(`.view[data-v="${id}"]`), $(`.ph-th[data-v="${id}"]`) ].filter(Boolean); };
const isPt = () => cv.classList.contains('pt');

/* --- الحالات (flags) ومزامنة data-on/data-off --- */
function sync(root, anim){
  $$('[data-on]',root).forEach(el=>{
    const on=root.classList.contains(el.dataset.on), was=el.classList.contains('shown');
    el.classList.toggle('shown',on);
    if(on && !was && anim) el.classList.add('enter'); else if(!on) el.classList.remove('enter');
  });
  $$('[data-off]',root).forEach(el=>el.classList.toggle('gone', root.classList.contains(el.dataset.off)));
}
function setFlags(on, list, anim){ roots().forEach(r=>{ list.forEach(f=>r.classList.toggle(f,on)); sync(r, anim); }); }
/* قائمة ⋮ في الفعاليات تُوضع تحت زرها مهما كان التخطيط */
function placeMenu(){
  const m=$('#c4Menu'), k=$('#c4K2'), v=k && k.closest('.view'); if(!m||!k||!k.getClientRects().length) return;
  const kr=k.getBoundingClientRect(), vr=v.getBoundingClientRect(), s=S.scale;
  m.style.left=Math.max(8,(kr.left-vr.left)/s)+'px'; m.style.top=((kr.bottom-vr.top)/s+4)+'px';
}

/* --- الأرقام والرسوم --- */
function derive(){
  VALS.accRate = pct(VALS.acc||0, inv.invitees);
  VALS.absent  = Math.max(0,(VALS.acc||0)-(VALS.present||0));
  VALS.attRate = pct(VALS.present||0, VALS.acc||0);
}
function paintText(key, v){ $$(`[data-n="${key}"]`).forEach(el=>{ el.textContent = el.dataset.fmt==='pct' ? v+'%' : fmt(v); }); }
function paintCharts(){
  $$('[data-bar]').forEach(el=>{ const v=VALS[el.dataset.bar]; if(v==null) return; el.style.width = (v/(+el.dataset.max)*100).toFixed(2)+'%'; });
  $$('[data-hbar]').forEach(el=>{ const v=VALS[el.dataset.hbar]; if(v==null) return; el.style.height = (v/(+el.dataset.max)*100).toFixed(2)+'%'; });
  const C = 2*Math.PI*36, a=(VALS.acc||0)/inv.invitees*C, p=(VALS.apo||0)/inv.invitees*C, gap=a&&p?1.5:0;
  const dA=$('#dnAcc'), dP=$('#dnApo');
  if(dA){ dA.setAttribute('stroke-dasharray',`${Math.max(0,a-gap)} ${C}`); dP.setAttribute('stroke-dasharray',`${Math.max(0,p-gap)} ${C}`); dP.setAttribute('stroke-dashoffset', -a); }
  const g=$('#gPres'); if(g){ const acc=VALS.acc||1; g.setAttribute('stroke-dasharray', `${(VALS.present||0)/acc*100} 100`); g.style.strokeOpacity = VALS.present ? 1 : 0; }
}
function setNums(o, anim, ms=700){
  const from = {...VALS}; Object.assign(VALS,o); derive();
  const keys = Object.keys(VALS);
  if(!anim){ keys.forEach(k=>paintText(k,VALS[k])); paintCharts(); return; }
  paintCharts();
  const g=S.gen, t0=performance.now(), changed=keys.filter(k=>from[k]!==VALS[k]);
  keys.filter(k=>!changed.includes(k)).forEach(k=>paintText(k,VALS[k]));
  const step = now=>{ if(g!==S.gen) return; const p=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-p,3);
    changed.forEach(k=>paintText(k, (from[k]??0)+(VALS[k]-(from[k]??0))*e)); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* --- الإبراز (ring) --- */
const ring = $('#ring');
function ringTo(sel){
  const s = typeof sel==='string' ? sel : (isPt()? sel.p : sel.l);
  const el = s && $(s);
  if(!el || !el.getClientRects().length){ ring.classList.remove('on'); return; }
  placeRing(el);
  ring.classList.add('on'); ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse');
  ring._sel = sel;
  clearTimeout(ring._t); ring._t = setTimeout(()=>{ if(ring._sel===sel && ring.classList.contains('on')) ringTo2(sel); }, 560);
}
function ringTo2(sel){ const s = typeof sel==='string' ? sel : (isPt()? sel.p : sel.l); const el=s&&$(s); if(!el||!el.getClientRects().length) return;
  placeRing(el); }
function placeRing(el){
  const box=(el.closest('.content')||el.closest('.ph-bd')||el.closest('.win')||cv).getBoundingClientRect();
  let r=el.getBoundingClientRect();
  const L=Math.max(r.left,box.left), T=Math.max(r.top,box.top), Rr=Math.min(r.right,box.right), B=Math.min(r.bottom,box.bottom);
  const c=cv.getBoundingClientRect(), k=S.scale, pad=3;
  Object.assign(ring.style,{ left:((L-c.left)/k-pad)+'px', top:((T-c.top)/k-pad)+'px', width:(Math.max(0,Rr-L)/k+pad*2)+'px', height:(Math.max(0,B-T)/k+pad*2)+'px' });
}

/* --- واجهة الإشارات (ctx) --- */
function makeCtx(anim, past){
  return {
    flag:(...f)=>setFlags(true,f,anim&&!past), unflag:(...f)=>setFlags(false,f,false),
    num:(o,ms)=>setNums(o, anim&&!past, ms),
    type:(sel,txt,ms)=>{ const el=$(sel); if(!el) return; if(!anim||past){ el.textContent=txt; return; }
      const g=S.gen, t0=performance.now(); const st=now=>{ if(g!==S.gen) return; const p=Math.min(1,(now-t0)/ms); el.textContent=txt.slice(0,Math.ceil(txt.length*p)); if(p<1) requestAnimationFrame(st); }; requestAnimationFrame(st); },
    clear:sel=>{ const el=$(sel); if(el) el.textContent=''; },
    ring:s=>{ if(past) return; ringTo(s); },
    toast:(t,i)=>{ if(past) return; const el=$('#toast'); el.innerHTML=ic(i||'check',14)+t; el.classList.add('on'); const g=S.gen; later(()=>{ if(g===S.gen) el.classList.remove('on'); },2600,true); },
    nav:(n,c)=>setNav(n,c),
    focus:f=>cv.classList.toggle('fphone', f==='phone'),
    press:sel=>{ if(past||!anim) return; const el=$(sel); if(!el) return; el.classList.remove('press'); void el.offsetWidth; el.classList.add('press'); },
    ai:v=>{ $('#aiv').textContent=v+'%'; },
  };
}
function later(fn,ms,force){ const id=setTimeout(fn,ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

/* --- التنقل في الشريط الجانبي والمسار --- */
function setNav(id, crumb){
  $$('.sb-i').forEach(e=>e.classList.toggle('on', e.dataset.nav===id));
  const on=$(`.sb-i[data-nav="${id}"]`); if(on) $('#sbInd').style.top = on.offsetTop+'px';
  $('#crumb').innerHTML = crumb.map((c,i)=> i<crumb.length-1 ? `<span class="m">${c}</span>${ic('chevL',12)}` : `<span>${c}</span>`).join('');
}

/* --- تطبيق خطوة --- */
function runCues(beat, anim, past){
  const ctx = makeCtx(anim, past), g=S.gen;
  setFlags(true, ['s'+beat._i]);
  beat.cues.forEach(([ms,...fns])=>{
    if(!anim || past){ fns.forEach(f=>f(ctx)); }
    else later(()=>{ if(g===S.gen) fns.forEach(f=>f(ctx)); }, ms);
  });
}
function resetChapter(ch){
  const vClass = VIEW_CLASS[ch.id];
  roots().forEach(r=>{ r.className = r.classList.contains('view') ? `view ${vClass} on` : 'ph-th on'; r.classList.add('instant'); sync(r,false); });
  $$('#c1Tx').forEach(e=>e.textContent='');
  VALS = {}; setNums(ch.base||{}, false);
  setNav(ch.nav, ch.crumb);
  cv.classList.remove('fphone');
  $('#aiv').textContent = (ch.ai ?? D.ai.after) + '%';
  $('#toast').classList.remove('on');
}
function endInstant(){ requestAnimationFrame(()=>requestAnimationFrame(()=>roots().forEach(r=>r.classList.remove('instant')))); }

/* الانتقال إلى فصل/خطوة. animate=false للقفز الفوري */
function go(chIdx, beatIdx=0, {swap=true}={}){
  S.gen++; clearTimers(); S.t=-600;   // يمنع انتهاء مدة الخطوة الحالية أثناء الانتقال (كان يُلغي النقرة أحياناً)
  const ch = CHAPTERS[chIdx], changing = chIdx!==S.ch || !S.started;
  const motion = !RM, doSwap = swap && changing && motion;
  const apply = ()=>{
    S.ch=chIdx; S.beat=beatIdx; S.t=0; S.started=true;
    $$('.view').forEach(v=>v.classList.toggle('on', v.dataset.v===ch.id));
    $$('.ph-th').forEach(v=>v.classList.toggle('on', v.dataset.v===ch.id));
    cv.classList.toggle('nophone', !ch.phone);
    resetChapter(ch);
    for(let i=0;i<beatIdx;i++) runCues(ch.beats[i], false, true);
    endInstant();
    paintUI();
    const g=S.gen;
    later(()=>{ if(g!==S.gen) return; $('#win').classList.remove('swap'); runCues(ch.beats[beatIdx], motion, false); announce(); }, doSwap ? 380 : 60);
  };
  ring.classList.remove('on');
  if(doSwap){ $('#win').classList.add('swap'); const g=S.gen; later(()=>{ if(g===S.gen) apply(); }, 220); }
  else apply();
  if(changing){ try{ parent!==window && parent.postMessage({type:'atras-showcase', event:'chapter', chapter:ch.id}, '*'); }catch(e){} }
}
function next(user){
  const ch=CHAPTERS[S.ch];
  if(S.beat < ch.beats.length-1) return go(S.ch, S.beat+1);
  if(S.ch < CHAPTERS.length-1) return go(S.ch+1, 0);
  try{ parent!==window && parent.postMessage({type:'atras-tour-complete'}, '*'); }catch(e){}
  if(!OPT.loop && !user){ setPlaying(false); return; }
  go(0,0);
}
function prev(){
  if(S.beat>0) return go(S.ch, S.beat-1);
  if(S.ch>0) return go(S.ch-1, CHAPTERS[S.ch-1].beats.length-1);
}

/* --- واجهة التحكم: الشريط، الشرح، النقاط --- */
function buildControls(){
  $('#rail').innerHTML = CHAPTERS.map((c,i)=>`<button class="ri" role="tab" id="tab-${c.id}" aria-selected="false" tabindex="-1" data-i="${i}">
      ${ic(c.icon,18)}<span><b>${c.label}</b><small>${c.desc}</small></span><span class="pg"><i></i></span></button>`).join('');
  $('#bPrev').innerHTML = ic('chevR',16); $('#bNext').innerHTML = ic('chevL',16);
  $('#rail').addEventListener('click', e=>{ const b=e.target.closest('.ri'); if(!b) return; S.userPaused=false; setPlaying(true); go(+b.dataset.i, 0); });
  $('#rail').addEventListener('keydown', e=>{
    const k=e.key, n=CHAPTERS.length; let i=S.ch;
    if(k==='ArrowLeft') i=(i+1)%n; else if(k==='ArrowRight') i=(i-1+n)%n; else if(k==='Home') i=0; else if(k==='End') i=n-1; else return;
    e.preventDefault(); go(i,0); $(`#tab-${CHAPTERS[i].id}`).focus();
  });
  $('#bNext').onclick = ()=>{ S.userPaused=true; setPlaying(false); next(true); };
  $('#bPrev').onclick = ()=>{ S.userPaused=true; setPlaying(false); prev(); };
  $('#bPlay').onclick = ()=>{ const p=!S.playing; S.userPaused=!p; setPlaying(p); if(p && S.done){ S.done=false; next(true); } };
  $('#dots').addEventListener('click', e=>{ const d=e.target.closest('.dt'); if(!d) return; S.userPaused=true; setPlaying(false); go(S.ch,+d.dataset.i); });
}
function paintUI(){
  const ch=CHAPTERS[S.ch];
  $$('.ri').forEach((b,i)=>{ const on=i===S.ch; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; if(!on) $('.pg i',b).style.width='0'; });
  $('#capIc').innerHTML = ic(ch.icon,18);
  $('#capPr').textContent = ch.promise;
  const bt=$('#capBt'); bt.classList.add('out');
  setTimeout(()=>{ bt.textContent = ch.beats[S.beat].t; bt.classList.remove('out'); }, RM?0:160);
  $('#dots').innerHTML = ch.beats.map((b,i)=>`<span class="dt ${i===S.beat?'on':i<S.beat?'done':''}" data-i="${i}"></span>`).join('');
}
function announce(){ const ch=CHAPTERS[S.ch]; $('#live').textContent = `${ch.label}: ${ch.beats[S.beat].t}`; }
function setPlaying(p){
  S.playing=p; cv.classList.toggle('paused', !p);
  $('#bPlay').innerHTML = ic(p?'pause':'play',15);
  $('#bPlay').setAttribute('aria-label', p?'إيقاف مؤقت':'تشغيل الجولة');
  $('#live').setAttribute('aria-live', p?'off':'polite');
}

/* --- الحلقة الزمنية --- */
function loop(now){
  const dt = Math.min(100, now-(S.last||now)); S.last=now;
  const ch=CHAPTERS[S.ch];
  if(S.playing && S.visible && S.started){
    S.t += dt;
    if(S.t >= ch.beats[S.beat].dur){ S.t=0; next(false); }
  }
  const total = sum(ch.beats.map(b=>b.dur)), done = sum(ch.beats.slice(0,S.beat).map(b=>b.dur)) + Math.min(S.t, ch.beats[S.beat].dur);
  const bar=$(`#tab-${ch.id} .pg i`); if(bar) bar.style.width = (done/total*100).toFixed(2)+'%';
  requestAnimationFrame(loop);
}

/* --- الملاءمة مع حجم الإطار (يحافظ على الوضوح بأي مقاس) --- */
function fit(){
  const TOP = OPT.compare?42:0, W=innerWidth, H=innerHeight-TOP;
  const pt = OPT.layout==='portrait' || (OPT.layout==='auto' && W/H < 1.2);
  cv.classList.toggle('pt', pt);
  const bw = pt?420:1040, bh = pt?812:645;
  const k = Math.min(W/bw, H/bh); S.scale=k;
  cv.style.transform = `translate(${(W-bw*k)/2}px,${(H-bh*k)/2}px) scale(${k})`;
  const on=$('.sb-i.on'); if(on) $('#sbInd').style.top = on.offsetTop+'px';
  if(ring._sel && ring.classList.contains('on')) requestAnimationFrame(()=>ringTo(ring._sel));
}

/* --- رسائل من الصفحة الأم (اختياري) --- */
addEventListener('message', e=>{
  const m=e.data; if(!m || m.type!=='atras-showcase' || !m.action) return;
  if(m.action==='play'){ S.userPaused=false; setPlaying(true); }
  if(m.action==='pause'){ S.userPaused=true; setPlaying(false); }
  if(m.action==='goto'){ const i=CHAPTERS.findIndex(c=>c.id===m.chapter); if(i>=0) go(i, +m.beat||0); }
});


/* =====================================================================
   تلميحات التفاعل
   ===================================================================== */
const HINTS = { 0:[], 1:['ghost'], 2:['aff','tip'], 3:['nudge','tip'], 4:['hover','tip'], 5:['cap'], 6:['aff','tip','ghost','cap'], 7:['aff','tip','ghost'] };
const HINT_NAMES = [['0','بدون'],['1','مؤشر يقوم بأول نقرة'],['2','أزرار واضحة'],['3','نبضة + وسم'],['4','منطقة تفاعلية'],['5','سطر إرشاد'],['6','التوصية (2+1+5)']];
const H = { on:new Set(), timers:[], touched:false, mode:0, hoverPaused:false };
const hLater = (fn,ms)=>{ const id=setTimeout(fn,ms); H.timers.push(id); return id; };

/* هدف التلميح: أيقونة الشريط الجانبي للفصل التالي، أو تبويب الفصل في الوضع العمودي */
function hintTarget(){
  const nxt = (S.ch+1)%CHAPTERS.length, c = CHAPTERS[nxt];
  const sbEl = isPt() ? null : $(`.sb-i.act[data-nav="${c.nav}"]`);
  return { el: sbEl || $(`#tab-${c.id}`), idx:nxt, rail:!sbEl };
}
function cvPos(el){
  const r=el.getBoundingClientRect(), c=cv.getBoundingClientRect(), k=S.scale||1;
  return { x:(r.left-c.left)/k, y:(r.top-c.top)/k, w:r.width/k, h:r.height/k };
}
function hintHide(){
  $('#ghost').classList.remove('on','press'); $('#tag').classList.remove('on'); $('#cap').classList.remove('hinting');
  $$('.nudge').forEach(e=>e.classList.remove('nudge'));
}
function hintKill(){ H.timers.forEach(clearTimeout); H.timers=[]; hintHide(); }
function userTouched(){ if(H.touched) return; H.touched=true; hintKill(); }

/* مقترح 1 — المؤشر يضغط على القسم التالي مرة واحدة ثم يختفي */
function runGhost(delay){
  hLater(function tryRun(){
    if(H.touched) return;
    if(!S.visible || !S.started){ hLater(tryRun,600); return; }
    const t=hintTarget(); if(!t.el) return;
    const g=$('#ghost'), p=cvPos(t.el), tx=p.x+p.w*0.55, ty=p.y+p.h*0.45;
    const sx = t.rail ? tx-70 : tx-150, sy = t.rail ? ty+80 : ty+70;
    g.style.transition='none'; g.style.transform=`translate(${sx}px,${sy}px)`; void g.offsetWidth;
    g.style.transition=''; g.classList.add('on');
    hLater(()=>{ g.style.transform=`translate(${tx}px,${ty}px)`; },60);
    hLater(()=>{ g.classList.add('press'); t.el.classList.add('rip'); },1300);
    hLater(()=>{ t.el.classList.remove('rip'); g.classList.remove('press'); S.userPaused=false; setPlaying(true); go(t.idx,0); },1520);
    hLater(()=>{ g.classList.remove('on'); },2300);
  }, delay);
}
/* مقترح 3 — نبضة + وسم "جرّب بنفسك" (مرتان كحد أقصى، تتوقف عند أول تفاعل) */
function runNudge(delay){
  const once=()=>{
    if(H.touched) return;
    if(!S.visible || !S.started){ hLater(once,800); return; }
    const t=hintTarget(); if(!t.el) return;
    const tag=$('#tag'), p=cvPos(t.el);
    t.el.classList.add('nudge');
    tag.classList.toggle('dn', t.rail);
    tag.style.transform = t.rail ? `translate(${p.x+p.w/2-34}px,${p.y+p.h+9}px)` : `translate(${p.x-tag.offsetWidth-11}px,${p.y+p.h/2-13}px)`;
    tag.classList.add('on');
    hLater(()=>{ tag.classList.remove('on'); t.el.classList.remove('nudge'); },4200);
  };
  hLater(once,delay); hLater(once,delay+14000);
}
/* مقترح 5 — سطر الإرشاد داخل شريط الشرح */
function capHintShow(ms){
  const pt=isPt();
  $('#capHintTx').textContent = pt ? 'اضغط على أي فصل في الشريط العلوي لتستكشفه' : 'اضغط على أي قسم مضيء في الشريط الجانبي لتستكشفه';
  $('#capHint i').innerHTML = ic('chevL',14);
  $('#cap').classList.add('hinting');
  if(ms) hLater(()=>$('#cap').classList.remove('hinting'), ms);
}
function runCapHint(delay){ hLater(()=>{ if(!H.touched) capHintShow(4500); },delay); hLater(()=>{ if(!H.touched) capHintShow(4500); },delay+16000); }

/* مقترح 4 — إيقاف مؤقت أثناء المرور + إبراز المنطقة */
function hoverIn(){ if(!H.on.has('hover')) return; if(S.playing && !S.userPaused){ H.hoverPaused=true; setPlaying(false); } capHintShow(0); }
function hoverOut(){ if(!H.on.has('hover')) return; if(H.hoverPaused){ H.hoverPaused=false; if(!S.userPaused) setPlaying(true); } $('#cap').classList.remove('hinting'); }

function applyHint(n){
  hintKill(); H.touched=false; H.mode=n; H.on=new Set(HINTS[n]||[]);
  ['aff','tip','hover'].forEach(k=>cv.classList.toggle('h-'+k, H.on.has(k)));
  if(H.hoverPaused){ H.hoverPaused=false; setPlaying(true); }
  $$('#cmp button').forEach(b=>b.classList.toggle('on', +b.dataset.h===n));
  if(RM) return;
  if(H.on.has('ghost')) runGhost(3200);
  if(H.on.has('nudge')) runNudge(5000);
  if(H.on.has('cap'))   runCapHint(3500);
}
function buildHints(){
  /* نقر الشريط الجانبي (الفعّال فقط) */
  $('#sb').addEventListener('click', e=>{
    const b=e.target.closest('.sb-i.act'); if(!b) return;
    const nav=b.dataset.nav; let idx=SB_GO[nav];
    if(nav==='tools' && S.ch===1) idx=3;            // الأدوات: حملات ⇄ فعاليات
    S.userPaused=false; setPlaying(true); go(idx,0);
  });
  document.addEventListener('pointerdown', e=>{ if(e.target.closest && e.target.closest('#cmp')) return; userTouched(); }, true);
  document.addEventListener('keydown', e=>{ if(e.target.closest && e.target.closest('#cmp')) return; userTouched(); }, true);
  $('#win').addEventListener('mouseenter', hoverIn); $('#win').addEventListener('mouseleave', hoverOut);
  if(OPT.compare){
    document.body.classList.add('cmp');
    $('#cmp').innerHTML = '<b>معاينة المقترحات:</b>' + HINT_NAMES.map(([k,l],i)=>`<button type="button" data-h="${k}" class="${i===6?'rec':''}">${k==='0'?l:k+' · '+l}</button>`).join('');
    $('#cmp').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; applyHint(+b.dataset.h); go(0,0,{swap:false}); S.userPaused=false; setPlaying(!RM); });
  }
  applyHint(OPT.hint);
}

/* --- التشغيل --- */
function init(){
  document.addEventListener('animationend', e=>{ if(e.target.classList) e.target.classList.remove('press','enter'); });
  buildChrome(); buildViews(); buildControls();
  buildHints(); fit(); addEventListener('resize', fit);
  const start = Math.max(0, CHAPTERS.findIndex(c=>c.id===P.get('chapter')));
  setPlaying(OPT.autoplay); if(!OPT.autoplay) S.userPaused=true;
  go(start, 0, {swap:false});
  cv.classList.add('ready');
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{ S.visible = es[0].isIntersecting; }, {threshold:.25}).observe($('#app'));
  }
  document.addEventListener('visibilitychange', ()=>{ S.visible = !document.hidden; });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fit(); if(ring._sel) ringTo(ring._sel); });
  requestAnimationFrame(loop);
  if(OPT.debug){ const issues=checkDemo(); console[issues.length?'warn':'info']('[atras-showcase] data check:', issues.length?issues:'OK — كل الأرقام متسقة'); }
  window.__showcase = { go, S, H, applyHint, CHAPTERS, checkDemo, VALS:()=>VALS };
}
init();
</script>
